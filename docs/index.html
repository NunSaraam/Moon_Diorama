  canvas{display:block;outline:none}
  #title{position:fixed;left:22px;top:18px;pointer-events:none;line-height:1.15}
  #title b{font-size:26px;font-weight:400;letter-spacing:.5px;
    background:linear-gradient(90deg,#9ff3ff,#b9a4ff 60%,#ffb3d9);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(130,160,255,.35))}
  #title span{display:block;font-size:13px;color:rgba(210,215,255,.6);margin-top:4px}

  #hint em{font-style:normal;color:#9ff3ff}
  #banner{position:fixed;left:50%;top:22px;transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;

    background:linear-gradient(90deg,rgba(80,60,200,.75),rgba(200,80,170,.7));border:1px solid rgba(255,255,255,.35);

  #banner.on{opacity:1;transform:translate(-50%,0)}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import GUI from 'lil-gui';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =========================================================
   설정값
   ========================================================= */
const P = {
  shallow:'#9ff3ff', mid:'#4fa8ff', deep:'#6a4cff', opacity:0.72, sparkle:1.0,
  moonIntensity:2.6, moonColor:'#e2eaff', moonAzimuth:-48, moonElevation:52, rim:1.0,
  jellyStrength:1.0, damping:1.1, waveSpeed:1.0, dropCount:12, idleWave:1.0,
  starDensity:1.0, meteorFreq:4, asteroidSpeed:1.0, nebula:1.0, showSolar:true, solarSpeed:1.0,
  autoRotate:false, autoRotateSpeed:0.6, fov:35, blur:0.75,
  quality:'high', bloom:0.7, grain:0.035, vignette:0.32, showFps:true,
};
const QUALITY = {
  low:    { pr:()=>Math.min(devicePixelRatio,1)*0.9, samples:0, bloom:false, tilt:false, shadow:0,    asteroids:7,  bubbles:36,  stars:1400, dust:220, seg:[64,46] },
  medium: { pr:()=>Math.min(devicePixelRatio,1.25),  samples:2, bloom:true,  tilt:true,  shadow:1024, asteroids:11, bubbles:80,  stars:2400, dust:380, seg:[110,78] },
  high:   { pr:()=>Math.min(devicePixelRatio,2),     samples:4, bloom:true,  tilt:true,  shadow:2048, asteroids:15, bubbles:140, stars:3600, dust:600, seg:[160,112] },
};

/* ---------- 유틸 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rnd = mulberry32(20261015);
const rr=(a,b)=>a+(b-a)*rnd();
const TAU=Math.PI*2;
function canvasTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
function jitter(geo, fn){
  const p=geo.attributes.position, map=new Map();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const k=`${x.toFixed(3)}|${y.toFixed(3)}|${z.toFixed(3)}`;
    let o=map.get(k); if(!o){o=fn(x,y,z); map.set(k,o);}
    p.setXYZ(i,x+o[0],y+o[1],z+o[2]);
  }
  geo.computeVertexNormals(); return geo;
}
const std=(color,o={})=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:.75,metalness:0,flatShading:false},o));
// 꼭짓점을 합쳐 부드러운(스무딩) 노멀을 만든다 — 로켓과 같은 매끈한 표현으로 통일
function smoothGeo(g,flatTopY=null){
  if(g.attributes.uv) g.deleteAttribute('uv'); if(g.attributes.normal) g.deleteAttribute('normal');
  const m=mergeVertices(g,1e-3); m.computeVertexNormals();
  if(flatTopY!==null){ // 윗면은 평평하게 두고 가장자리만 둥글게 보이도록
    const p=m.attributes.position,n=m.attributes.normal;
    for(let i=0;i<p.count;i++) if(p.getY(i)>=flatTopY-1e-3) n.setXYZ(i,0,1,0);
    n.needsUpdate=true;
  }
  return m;
}

/* =========================================================
   렌더러 / 씬 / 카메라
   ========================================================= */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping ?? THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#05071a');

const camera=new THREE.PerspectiveCamera(P.fov,innerWidth/innerHeight,0.1,2500);
const TARGET=new THREE.Vector3(0,-2.4,0);
const HOME_AZ=THREE.MathUtils.degToRad(38), HOME_EL=THREE.MathUtils.degToRad(32), HOME_DIST=24;
function homePos(){
  return new THREE.Vector3(Math.sin(HOME_AZ)*Math.cos(HOME_EL),Math.sin(HOME_EL),Math.cos(HOME_AZ)*Math.cos(HOME_EL)).multiplyScalar(HOME_DIST).add(TARGET);
}
camera.position.copy(homePos());
camera.lookAt(TARGET);
function updateView(){
  const w=innerWidth,h=innerHeight;
  camera.aspect=w/h;
  // 블록을 화면 중앙보다 살짝 왼쪽·아래로, 오른쪽 설정 패널 쪽에 여백
  camera.setViewOffset(w,h,w*0.07,-h*0.03,w,h);
  camera.updateProjectionMatrix();
}
updateView();

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping=true; controls.dampingFactor=0.07;
controls.minDistance=8; controls.maxDistance=42;
controls.maxPolarAngle=Math.PI*0.66;
controls.screenSpacePanning=true;
controls.rotateSpeed=0.7;
controls.update();

// 처음 시점 기준 축 (배경 천체 배치용)
const camDir=new THREE.Vector3().subVectors(homePos(),TARGET).normalize();
const camFwd=camDir.clone().negate();
const camRight=new THREE.Vector3().crossVectors(camFwd,new THREE.Vector3(0,1,0)).normalize();
const camUp=new THREE.Vector3().crossVectors(camRight,camFwd).normalize();

/* =========================================================
   조명
   ========================================================= */
const hemi=new THREE.HemisphereLight(0x9fb0ff,0x2b1a55,1.15); scene.add(hemi);
const moonLight=new THREE.DirectionalLight(P.moonColor,P.moonIntensity);
moonLight.castShadow=true;
moonLight.shadow.mapSize.set(2048,2048);
Object.assign(moonLight.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:60});
moonLight.shadow.bias=-0.0006; moonLight.shadow.normalBias=0.03;
scene.add(moonLight); scene.add(moonLight.target);
const rimLight=new THREE.DirectionalLight(0xb48cff,0.9); rimLight.position.set(12,6,-14); scene.add(rimLight);
const moonLightDir=new THREE.Vector3();
function updateMoonLight(){
  const az=THREE.MathUtils.degToRad(P.moonAzimuth)+HOME_AZ, el=THREE.MathUtils.degToRad(P.moonElevation);
  moonLightDir.set(Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)).normalize();
  moonLight.position.copy(moonLightDir).multiplyScalar(25);
  moonLight.intensity=P.moonIntensity; moonLight.color.set(P.moonColor);
}
updateMoonLight();

/* =========================================================
   디오라마 블록
   ========================================================= */
const W=10, D=7, HW=W/2, HD=D/2;
const Y_WB=-1.6, Y_RB=-2.4, Y_KB=-3.4, Y_CB=-4.3;
const diorama=new THREE.Group(); scene.add(diorama);

// --- 단면 텍스처 ---
const regolithTex=canvasTex(512,128,(g,w,h)=>{
  g.fillStyle='#a4a3b8'; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){const v=rr(-30,30);g.fillStyle=`rgba(${150+v},${148+v},${172+v},${rr(.3,.8)})`;g.fillRect(rr(0,w),rr(0,h),rr(1,4),rr(1,3));}
  for(let i=0;i<60;i++){g.fillStyle=`rgba(120,118,145,${rr(.4,.8)})`;g.beginPath();g.ellipse(rr(0,w),rr(0,h),rr(3,8),rr(2,5),0,0,TAU);g.fill();}
  g.fillStyle='rgba(220,220,240,.55)'; g.fillRect(0,0,w,5);
});
// 암석층: 깔끔한 그라데이션 + 둥근 자갈 + 부드러운 지층선
const rockTex=canvasTex(512,128,(g,w,h)=>{
  const r2=mulberry32(311); const R=(a,b)=>a+(b-a)*r2();
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#7569ad'); gr.addColorStop(1,'#544990');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  for(const [yy,amp,ph] of [[0.36,5,0.4],[0.7,4,2.1]]){
    g.strokeStyle='rgba(255,255,255,.13)'; g.lineWidth=3; g.beginPath();
    for(let x=0;x<=w;x+=8){const y=h*yy+Math.sin(x*0.02+ph)*amp+Math.sin(x*0.051+ph*2)*amp*0.4; x?g.lineTo(x,y):g.moveTo(x,y);} g.stroke();
  }
  for(let i=0;i<20;i++){const x=R(0,w),y=R(10,h-10),rx=R(7,16),ry=rx*R(.5,.7);
    g.fillStyle='rgba(160,150,220,.32)'; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,TAU); g.fill();
    g.fillStyle='rgba(255,255,255,.14)'; g.beginPath(); g.ellipse(x-rx*.25,y-ry*.3,rx*.45,ry*.35,0,0,TAU); g.fill();}
});
// 크리스털 광맥층: 매끄러운 광맥 2줄 + 정돈된 정동(지오드) 주머니
function drawVeins(g,w,h,glowOnly){
  const r2=mulberry32(77); const R=(a,b)=>a+(b-a)*r2();
  if(!glowOnly){ const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#3a2d78'); gr.addColorStop(1,'#2a2160'); g.fillStyle=gr; g.fillRect(0,0,w,h); }
  else { g.fillStyle='#000'; g.fillRect(0,0,w,h); }
  const veins=[['#5ff5e6',0.42,0.0],['#ff9be6',0.62,2.3]];
  for(const [c,yy,ph] of veins){
    const path=()=>{g.beginPath(); for(let x=-10;x<=w+10;x+=6){const y=h*yy+Math.sin(x*0.009+ph)*h*0.16+Math.sin(x*0.027+ph)*h*0.05; x>-10?g.lineTo(x,y):g.moveTo(x,y);}};
    g.save(); g.globalAlpha=glowOnly?0.35:0.22; g.strokeStyle=c; g.lineWidth=11; g.shadowColor=c; g.shadowBlur=16; path(); g.stroke(); g.restore();
    g.save(); g.strokeStyle=glowOnly?c:'#ffffff'; g.globalAlpha=glowOnly?1:0.55; g.lineWidth=2.6; g.lineCap='round'; path(); g.stroke(); g.restore();
  }
  const cols=['#5ff5e6','#b59cff','#ff9be6','#8fdcff'];
  for(let i=0;i<7;i++){
    const x=(i+0.5)/7*w+R(-30,30), y=h*R(0.3,0.7), r=R(13,19), c=cols[i%4];
    const rg=g.createRadialGradient(x,y,0,x,y,r*1.6); rg.addColorStop(0,c); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.save(); g.globalAlpha=glowOnly?0.55:0.35; g.fillStyle=rg; g.beginPath(); g.ellipse(x,y,r*1.6,r*1.2,0,0,TAU); g.fill(); g.restore();
    if(!glowOnly){ g.fillStyle='#21194d'; g.beginPath(); g.ellipse(x,y,r,r*0.7,0,0,TAU); g.fill(); }
    for(let k=-2;k<=2;k++){ const cx=x+k*r*0.32, hh=r*(0.75-Math.abs(k)*0.15), ww=r*0.14;
      g.fillStyle=glowOnly?c:'#ffffff'; g.globalAlpha=glowOnly?1:0.85;
      g.beginPath(); g.moveTo(cx,y+r*0.45-hh); g.lineTo(cx+ww,y+r*0.45-hh*0.6); g.lineTo(cx+ww,y+r*0.45); g.lineTo(cx-ww,y+r*0.45); g.lineTo(cx-ww,y+r*0.45-hh*0.6); g.fill(); }
    g.globalAlpha=1;
  }
}
const crystalMap=canvasTex(1024,96,(g,w,h)=>drawVeins(g,w,h,false));
const crystalEmi=canvasTex(1024,96,(g,w,h)=>drawVeins(g,w,h,true));

function layer(top,bot,mat,shrink){
  const m=new THREE.Mesh(new RoundedBoxGeometry(W-shrink,top-bot,D-shrink,4,0.07),mat);
  m.position.y=(top+bot)/2; m.receiveShadow=true; diorama.add(m); return m;
}
layer(0,Y_RB,new THREE.MeshStandardMaterial({map:regolithTex,roughness:.95}),0);
// 블록 윗면: 달 표면 (작은 크레이터와 자갈)
let surfTexG=null, blockTop=null;
{
  const surfTex=surfTexG=canvasTex(1024,720,(g,w,h)=>{
    const r2=mulberry32(808); const R=(a,b)=>a+(b-a)*r2();
    g.fillStyle='#c4c2d8'; g.fillRect(0,0,w,h);
    for(let i=0;i<40;i++){const x=R(0,w),y=R(0,h),r=R(30,110); const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,r2()<.5?'rgba(150,146,185,.35)':'rgba(255,255,255,.25)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);}
    for(let i=0;i<2500;i++){g.fillStyle=r2()<.5?'rgba(255,255,255,.16)':'rgba(110,105,145,.16)'; g.fillRect(R(0,w),R(0,h),R(1,3),R(1,3));}
    for(let i=0;i<55;i++){const r=Math.pow(r2(),2.2)*26+4,x=R(r,w-r),y=R(r,h-r);
      g.fillStyle='rgba(150,146,188,.85)'; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
      g.fillStyle='rgba(120,115,160,.5)'; g.beginPath(); g.arc(x+r*.18,y+r*.18,r*.78,0,TAU); g.fill();
      g.strokeStyle='rgba(245,244,255,.8)'; g.lineWidth=Math.max(1.5,r*.18); g.beginPath(); g.arc(x,y,r,Math.PI*.6,Math.PI*1.5); g.stroke();}
  });
  const top=new THREE.Mesh(new THREE.PlaneGeometry(W-0.02,D-0.02),new THREE.MeshStandardMaterial({map:surfTex,roughness:.95}));
  top.rotation.x=-Math.PI/2; top.position.y=0.002; top.receiveShadow=true; diorama.add(top); blockTop=top;
  const pebM=std('#b3b1c9',{roughness:.95}); const r3=mulberry32(919);
  for(let i=0;i<26;i++){const x=(r3()-.5)*(W-1), z=(r3()-.5)*(D-1);
    if(Math.hypot((x+2.35)/2.7,(z+1)/2.1)<1 || Math.hypot(x-4.1,z-1.0)<1.1) continue;
    const m=new THREE.Mesh(smoothGeo(new THREE.IcosahedronGeometry(0.05+r3()*0.09,1)),pebM); m.scale.y=0.65; m.position.set(x,0.02,z); m.castShadow=true; diorama.add(m);}
}
layer(Y_RB,Y_KB,new THREE.MeshStandardMaterial({map:rockTex,roughness:.85}),0.12);
layer(Y_KB,Y_CB,new THREE.MeshStandardMaterial({map:crystalMap,emissiveMap:crystalEmi,emissive:0xffffff,emissiveIntensity:1.5,roughness:.55}),0.24);

// --- 크리스털: 육각 기둥 + 뾰족한 끝 ---
const _hexBody=new THREE.CylinderGeometry(0.11,0.13,0.5,6,1); _hexBody.translate(0,0.25,0);
const _hexTip=new THREE.ConeGeometry(0.11,0.24,6,1); _hexTip.translate(0,0.62,0);
const crystalGeo=mergeGeometries([_hexBody,_hexTip]);
const crystalMat=c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.15,roughness:.18,metalness:.05});
const crystalMats=['#5ff5e6','#b59cff','#8fdcff','#ff9be6'].map(crystalMat);
const crystalMatsSoft=['#5ff5e6','#b59cff','#ff9be6'].map(c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0.9,roughness:.2}));
const Yaxis=new THREE.Vector3(0,1,0);
function crystal(parent,pos,dir,len,mats=crystalMats,mat=null){
  const m=new THREE.Mesh(crystalGeo,mat||mats[Math.floor(rnd()*mats.length)]);
  dir=dir.clone().normalize(); m.quaternion.setFromUnitVectors(Yaxis,dir);
  m.scale.setScalar(len); m.position.copy(pos).addScaledVector(dir,-0.05*len); parent.add(m); return m;
}
// 같은 색끼리 부채꼴로 모인 크리스털 송이
function crystalCluster(pos,dir,size,mat){
  dir=dir.clone().normalize();
  const side=new THREE.Vector3().crossVectors(dir,Math.abs(dir.y)>0.9?new THREE.Vector3(1,0,0):Yaxis).normalize();
  const up=new THREE.Vector3().crossVectors(side,dir).normalize();
  const spec=[[0,0,1],[0.42,0.1,0.66],[-0.4,0.05,0.6],[0.12,-0.38,0.5],[-0.15,0.36,0.45]];
  for(const [a,b,k] of spec){
    const d=dir.clone().addScaledVector(side,a).addScaledVector(up,b);
    const p=pos.clone().addScaledVector(side,a*0.22*size).addScaledVector(up,b*0.22*size);
    crystal(diorama,p,d,size*k,null,mat);
  }
}

const RIP_N=12;
const ripples=Array.from({length:RIP_N},()=>new THREE.Vector4(0,0,-100,0));

const WU={
  uTime:{value:0}, uRipples:{value:ripples}, uHalf:{value:new THREE.Vector2(HW,HD)},
  uDamp:{value:P.damping}, uSpeed:{value:P.waveSpeed}, uIdle:{value:P.idleWave}, uJelly:{value:0},
  uShallow:{value:new THREE.Color(P.shallow)}, uMid:{value:new THREE.Color(P.mid)}, uDeep:{value:new THREE.Color(P.deep)},
  uOpacity:{value:P.opacity}, uSparkle:{value:P.sparkle},
  uLightDir:{value:moonLightDir}, uLightColor:{value:new THREE.Color(P.moonColor)},
};
const HEIGHT_GLSL=`
uniform float uTime; uniform vec4 uRipples[${RIP_N}]; uniform vec2 uHalf;
uniform float uDamp; uniform float uSpeed; uniform float uIdle; uniform float uJelly;
float heightAt(vec2 p){
  float h=uIdle*0.045*(sin(p.x*1.25+uTime*1.15)+sin(p.y*1.6-uTime*0.95)+0.6*sin((p.x+p.y)*2.3+uTime*1.7));
  for(int i=0;i<${RIP_N};i++){
    vec4 r=uRipples[i]; float age=uTime-r.z;
    if(r.w<=0.0||age<0.0||age>7.0) continue;
    float d=distance(p,r.xy);
    float env=exp(-age*uDamp);
    float fr=d-age*2.2*uSpeed;
    float ring=sin(fr*4.2)*exp(-fr*fr*0.5)*exp(-d*0.18);
    float bulge=cos(age*9.0*uSpeed)*exp(-d*d*1.4);
    h+=r.w*env*(ring*0.55+bulge*0.8);
  }
  float e=smoothstep(0.0,0.7,uHalf.x-abs(p.x))*smoothstep(0.0,0.7,uHalf.y-abs(p.y));
  return h*e+uJelly;
}`;
function sstep(a,b,x){const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
function heightAt(x,z,t){
  let h=P.idleWave*0.045*(Math.sin(x*1.25+t*1.15)+Math.sin(z*1.6-t*0.95)+0.6*Math.sin((x+z)*2.3+t*1.7));
  for(const r of ripples){
    const age=t-r.z; if(r.w<=0||age<0||age>7) continue;
    const d=Math.hypot(x-r.x,z-r.y), env=Math.exp(-age*P.damping), fr=d-age*2.2*P.waveSpeed;
    h+=r.w*env*(Math.sin(fr*4.2)*Math.exp(-fr*fr*0.5)*Math.exp(-d*0.18)*0.55+Math.cos(age*9*P.waveSpeed)*Math.exp(-d*d*1.4)*0.8);
  }
  return h*sstep(0,0.7,HW-Math.abs(x))*sstep(0,0.7,HD-Math.abs(z))+WU.uJelly.value;
}

const surfaceMat=new THREE.ShaderMaterial({
  uniforms:WU, transparent:true, depthWrite:false, side:THREE.DoubleSide,
  vertexShader:`${HEIGHT_GLSL}
    varying vec3 vW; varying vec3 vN; varying vec2 vL; varying float vH;
    void main(){
      vec3 p=position; float h=heightAt(p.xz); float e=0.06;
      float hx=heightAt(p.xz+vec2(e,0.)); float hz=heightAt(p.xz+vec2(0.,e));
      vec3 n=normalize(vec3(h-hx,e,h-hz));
      p.y+=h; vH=h-uJelly; vL=p.xz;
      vec4 wp=modelMatrix*vec4(p,1.); vW=wp.xyz; vN=normalize(mat3(modelMatrix)*n);
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    uniform vec3 uShallow,uMid,uDeep,uLightDir,uLightColor; uniform float uOpacity,uSparkle,uTime;
    varying vec3 vW; varying vec3 vN; varying vec2 vL; varying float vH;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;
      vec3 V=normalize(cameraPosition-vW);
      float fres=pow(1.-clamp(dot(N,V),0.,1.),3.);
      vec3 col=mix(uShallow,uMid,clamp(0.12+fres*1.3-vH*1.4,0.,1.));
      col=mix(col,uDeep,clamp(fres*0.5-vH*0.6,0.,0.6));
      float diff=max(dot(N,uLightDir),0.);
      col*=0.6+0.45*diff;
      vec3 H=normalize(uLightDir+V);
      col+=uLightColor*pow(max(dot(N,H),0.),140.)*1.2;
      col+=vec3(0.75,1.,1.)*smoothstep(0.06,0.22,vH)*0.22;
      vec2 g=vL*7.0; vec2 id=floor(g); vec2 f=fract(g)-0.5;
      float r=hash(id); vec2 off=vec2(hash(id+3.1),hash(id+7.7))-0.5;
      float tw=pow(clamp(0.5+0.5*sin(uTime*(1.5+r*3.)+r*40.),0.,1.),12.);
      float s=(1.0-smoothstep(0.0,0.09,length(f-off*0.6)))*step(0.55,r)*tw;
      col+=vec3(1.0,0.95,1.15)*s*2.0*uSparkle;
      float a=mix(uOpacity,1.0,fres*0.7);
      a=max(a,clamp(s*uSparkle,0.,1.));
      gl_FragColor=vec4(col,a);
    }`
});

    uniform float uJelly; varying vec3 vW; varying vec3 vN; varying vec3 vL;
    void main(){
      vec3 p=position; float t=clamp((p.y+1.6)/1.6,0.,1.);
      p.y+=uJelly*t; float b=1.0+uJelly*0.25*sin(t*3.14159); p.x*=b; p.z*=b;
      vL=p; vec4 wp=modelMatrix*vec4(p,1.); vW=wp.xyz; vN=normalize(mat3(modelMatrix)*normal);
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    uniform vec3 uShallow,uMid,uDeep; uniform float uOpacity,uSparkle,uTime;
    varying vec3 vW; varying vec3 vN; varying vec3 vL;
    float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
    void main(){
      float dt=clamp(-vL.y/1.6,0.,1.);
      vec3 col= dt<0.5 ? mix(uShallow,uMid,dt*2.) : mix(uMid,uDeep,dt*2.-1.);
      vec3 N=normalize(vN); vec3 V=normalize(cameraPosition-vW);
      float fres=pow(clamp(1.-abs(dot(N,V)),0.,1.),2.);

      col+=uDeep*0.25*(0.5+0.5*sin(vL.x*2.2+vL.z*1.7+uTime*0.8))*dt;
      vec2 q=(abs(N.x)>0.5? vL.zy : vL.xy)*6.0+vec2(0.,-uTime*0.9);
      vec2 id=floor(q); vec2 f=fract(q)-0.5; float r=hash3(vec3(id,N.x*3.+N.z));
      float tw=pow(clamp(0.5+0.5*sin(uTime*(1.+r*3.)+r*30.),0.,1.),8.);
      vec2 off=vec2(hash3(vec3(id,1.)),hash3(vec3(id,2.)))-0.5;
      float s=(1.0-smoothstep(0.,0.08,length(f-off*0.6)))*step(0.62,r)*tw;
      col+=vec3(1.,.95,1.2)*s*1.5*uSparkle;
      float a=uOpacity*0.8+fres*0.12;
      if(!gl_FrontFacing) a*=0.5;
      gl_FragColor=vec4(col,clamp(a+s*0.4,0.,1.));
    }`
});

function updateShip(dt){
  ship.t+=dt; const B=ship.body; let thrust=0;
  B.position.set(0,0,0); B.scale.set(1,1,1);
  if(ship.state==='ignite'){
    const k=ship.t/SHIP_IGNITE; thrust=0.25+0.4*k;
    B.position.set(rr(-1,1)*0.02*k,0,rr(-1,1)*0.02*k);
    if(ship.t>=SHIP_IGNITE){ ship.state='rise'; ship.t=0; }
  } else if(ship.state==='rise'){
    const s=Math.min(ship.t/SHIP_RISE,1), e=s*s*(3-2*s); ship.g.position.y=PAD_TOP+(HOVER_Y-PAD_TOP)*e; thrust=0.75;
    if(s>=1){ ship.state='hover'; ship.t=0; }
  } else if(ship.state==='hover'){

  } else if(ship.state==='depart'){ // 위로 빠르게 날아가며 작아짐
    const s=Math.min(ship.t/1.1,1); ship.g.position.y=HOVER_Y+s*s*9; const sc=1-s*0.85; B.scale.setScalar(sc); thrust=1.0;

    const k=Math.min(ship.t/SHIP_TOUCH,1); const sq=Math.sin(k*Math.PI*2)*0.08*(1-k);

}

  n.needsUpdate=true; return g;

    float rand(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);}
    void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 p=vUv-0.5;
      float v=(1.0-smoothstep(0.28,0.82,length(p*vec2(1.0,1.2)))); c.rgb*=mix(1.0-uVig,1.0,v);
      float g=rand(vUv*vec2(913.1,577.3)+fract(uTime*7.13)*100.)-0.5; c.rgb+=g*uGrain*(0.35+0.65*c.rgb);
      gl_FragColor=c; }`
};
let composer,bloomPass,tiltH,tiltV,finalPass;
function buildComposer(q){
  const Q=QUALITY[q];
  if(composer){composer.renderTarget1.dispose();composer.renderTarget2.dispose();composer.passes.forEach(p=>p.dispose&&p.dispose());}
  const pr=renderer.getPixelRatio();
  const rt=new THREE.WebGLRenderTarget(Math.floor(innerWidth*pr),Math.floor(innerHeight*pr),{type:THREE.HalfFloatType,samples:Q.samples});
  composer=new EffectComposer(renderer,rt);
  composer.setPixelRatio(pr); composer.setSize(innerWidth,innerHeight);
  composer.addPass(new RenderPass(scene,camera));
  composer.addPass(new ShaderPass(SanitizeShader));
  bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),P.bloom,0.5,0.95);
  bloomPass.enabled=Q.bloom; composer.addPass(bloomPass);
  tiltH=new ShaderPass(TiltShader); tiltV=new ShaderPass(TiltShader); tiltV.uniforms.uDir.value.set(0,1);
  tiltH.enabled=tiltV.enabled=Q.tilt; composer.addPass(tiltH); composer.addPass(tiltV);
  finalPass=new ShaderPass(FinalShader); composer.addPass(finalPass);
  composer.addPass(new OutputPass());
  updateTiltRes();
}
function updateTiltRes(){const pr=renderer.getPixelRatio(); for(const p of [tiltH,tiltV]) p.uniforms.uRes.value.set(innerWidth*pr,innerHeight*pr);}

function applyQuality(q){
  const Q=QUALITY[q];
  renderer.setPixelRatio(Q.pr()); renderer.setSize(innerWidth,innerHeight);
  prU.value=renderer.getPixelRatio();
  const wantShadow=Q.shadow>0;
  if(renderer.shadowMap.enabled!==wantShadow){renderer.shadowMap.enabled=wantShadow; scene.traverse(o=>{if(o.material){[].concat(o.material).forEach(m=>m.needsUpdate=true);}});}
  if(wantShadow){moonLight.shadow.mapSize.set(Q.shadow,Q.shadow); if(moonLight.shadow.map){moonLight.shadow.map.dispose();moonLight.shadow.map=null;}}
  moonLight.castShadow=wantShadow;
  buildAsteroids(Q.asteroids); buildStars(Math.round(Q.stars*P.starDensity)); buildDust(Q.dust);
  buildComposer(q);
}

const raycaster=new THREE.Raycaster(); const ndc=new THREE.Vector2();
const tmpV=new THREE.Vector3(), tmpBox=new THREE.Box3();
let down=null;
function setNDC(e){const r=renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); raycaster.setFromCamera(ndc,camera);}
function pick(){
  const objs=[astro.g,ship.g,robot.g,solar.g,island.userData.mesh,tower,dome,lander,antenna,...clouds.map(c=>c.g)];
  const hits=raycaster.intersectObjects(objs,true).filter(h=>h.object.visible&&!h.object.userData.noPick&&h.object.material&&h.object.material.visible!==false);
  let best=hits.length?{type:'obj',dist:hits[0].distance,hit:hits[0]}:null;
  if(best&&best.type==='obj'){
    let o=best.hit.object; while(o){ if(o===astro.g) return {type:'astro'}; if(o===ship.g) return {type:'ship'}; if(o===robot.g) return {type:'robot'}; if(o.userData&&o.userData.body) return !P.showSolar?{type:'other'}:(travel.mode==='select'?{type:'planet',i:solar.bodies.indexOf(o.userData.body)}:{type:'planetLocked'}); const c=clouds.find(c=>c.g===o); if(c) return {type:'cloud',cloud:c,point:best.hit.point}; o=o.parent; }
    return {type:'other',obj:best.hit.object};
  }
  return best;
}
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now(),b:e.button};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||down.b!==0) {down=null;return;}
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); const dt=performance.now()-down.t; down=null;
  if(moved>6||dt>600) return;
  setNDC(e); const r=pick(); if(!r) return;
  if(r.type==='astro') astroJump();
  else if(r.type==='ship') shipClicked();
  else if(r.type==='robot') robotClicked();
  else if(r.type==='planet') travelTo(r.i);
  else if(r.type==='planetLocked'&&travel.mode==='none') showBanner('먼저 우주선을 클릭해 주세요 🚀',2.2);
  else if(r.type==='cloud') cloudBurst(r.cloud,r.point);
});
let hoverT=0;
renderer.domElement.addEventListener('pointermove',e=>{
  if(down) return; const now=performance.now(); if(now-hoverT<60) return; hoverT=now;
  setNDC(e); const r=pick(); renderer.domElement.style.cursor=(r&&r.type!=='other'&&r.type!=='planetLocked')?'pointer':'grab';
});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

function addRipple(x,z,amp){ ripples[ripIdx].set(x,z,time,amp); ripIdx=(ripIdx+1)%RIP_N; }
function splash(l){
  const x=THREE.MathUtils.clamp(l.x,-HW+0.2,HW-0.2), z=THREE.MathUtils.clamp(l.z,-HD+0.2,HD-0.2);
  addRipple(x,z,0.36*P.jellyStrength);
  const h=heightAt(x,z,time); let n=P.dropCount;
  for(const d of drops){ if(n<=0) break; if(d.active) continue; n--;
    d.active=true; d.ripple=rnd()<0.35; d.m.visible=true;
    d.m.position.set(x+rr(-.12,.12),h+0.05,z+rr(-.12,.12));
    d.v.set(rr(-.75,.75),rr(1.7,3.3)*(0.7+0.3*P.jellyStrength),rr(-.75,.75));
    d.m.scale.setScalar(rr(.55,1.35)); d.base=d.m.scale.x;
  }
}
function astroJump(){ if(astro.jumping) return; astro.jumping=true; astro.vy=2.15; astro.squash=0.5; }
function cloudBurst(c,p){ c.puff=1; burstDust(c.g.getWorldPosition(new THREE.Vector3()),Math.round(dust.n*0.4)); }

const gui=new GUI({title:'디오라마 설정'});

  WU.uShallow.value.set(P.shallow); WU.uMid.value.set(P.mid); WU.uDeep.value.set(P.deep);

}
const fM=gui.addFolder('달빛');
fM.add(P,'moonIntensity',0,5,0.05).name('달빛 세기').onChange(updateMoonLight);
fM.addColor(P,'moonColor').name('달빛 색').onChange(()=>{updateMoonLight();WU.uLightColor.value.set(P.moonColor);});
fM.add(P,'moonAzimuth',-180,180,1).name('방향 (°)').onChange(updateMoonLight);

const fS=gui.addFolder('우주');

const fC=gui.addFolder('카메라');

const fQ=gui.addFolder('품질');
fQ.add(P,'quality',{'low (가벼움)':'low','medium (보통)':'medium','high (고품질)':'high'}).name('품질').onChange(applyQuality);

fQ.add(P,'showFps').name('FPS 표시').onChange(v=>{if(!v)fpsEl.textContent='';});
[fM,fS,fC].forEach(f=>f.close());

/* =========================================================
   애니메이션
   ========================================================= */
let time=0; const clock=new THREE.Clock();
const fpsEl=document.getElementById('fps'); let fpsAcc=0,fpsN=0;
const focusV=new THREE.Vector3();
function nextMeteorGap(){ return P.meteorFreq<=0?1e9:(60/P.meteorFreq)*rr(0.67,1.33); }

function tick(){
  const dt=Math.min(clock.getDelta(),0.05); time+=dt;
  WU.uTime.value=time;

  // 섬 소품
  dome.userData.cap.rotation.y=Math.sin(time*0.25)*0.9;
  antennaHead.rotation.y+=dt*0.8; antennaLamp.material.emissiveIntensity=Math.sin(time*4)>0?3.2:0.4;
  landerLamp.material.emissiveIntensity=1.5+1.5*Math.sin(time*3);
  { const p=flagGeo.attributes.position, b=flagGeo.userData.base;
    for(let i=0;i<p.count;i++){const x=b[i*3]; p.setZ(i,Math.sin(x*14-time*5)*0.035*(x/0.46)); p.setY(i,b[i*3+1]+Math.sin(x*10-time*4)*0.008*(x/0.46));}
    p.needsUpdate=true; flagGeo.computeVertexNormals(); }
  { const a=time*0.28, cx=-0.35, cz=0.35, rx=0.95, rz=0.62;
    rover.position.set(cx+Math.cos(a)*rx,TOP+Math.abs(Math.sin(time*9))*0.008,cz+Math.sin(a)*rz);
    rover.rotation.y=Math.atan2(-(Math.cos(a)*rz),-Math.sin(a)*rx);
    for(const w of roverWheels) w.rotation.z-=dt*3; }
  // 우주비행사
  if(astro.jumping){ astro.vy-=1.62*dt; astro.y+=astro.vy*dt;
    if(astro.y<=0){astro.y=0;astro.jumping=false;astro.squash=1;}
    astro.armR.rotation.z=2.6+Math.sin(time*5)*0.2; astro.armL.rotation.z=-2.6-Math.sin(time*5)*0.2;
  } else { astro.armR.rotation.z=2.45+Math.sin(time*7)*0.45; astro.armL.rotation.z=-0.3; }
  astro.squash=Math.max(0,astro.squash-dt*2.5);
  const sq=Math.sin(astro.squash*Math.PI*2)*0.12*astro.squash;
  astro.inner.position.y=astro.y; astro.inner.scale.set(1+sq,1-sq,1+sq);
  astro.inner.rotation.y=astro.jumping?Math.sin(time*2)*0.3:0;
  astro.shadow.position.y=0.016-astro.y; astro.shadow.scale.setScalar(1/(1+astro.y*0.8));
  astro.shadow.material.opacity=0.35/(1+astro.y*1.5);

  // 우주선 / 여행
  updateShip(dt); updateTravel(dt);
  // 탐사 로봇
  updateRobot(dt);

  // 구름
  for(const c of clouds){ c.puff=Math.max(0,c.puff-dt*1.4);
    const p=Math.sin(c.puff*Math.PI*3)*c.puff*0.18;
    c.g.position.set(c.base.x+Math.sin(time*0.18+c.ph)*0.45,c.base.y+Math.sin(time*0.5+c.ph)*0.1,c.base.z+Math.cos(time*0.15+c.ph)*0.2);
    c.g.scale.setScalar(c.s*(1+p)); c.g.rotation.y=Math.sin(time*0.1+c.ph)*0.2; }

  // 별가루
  if(dust){ let any=false; const {data,pos,alpha}=dust;
    for(let i=0;i<data.length;i++){const d=data[i]; if(d.life>=d.max){if(alpha[i]!==0){alpha[i]=0;any=true;} continue;}
      d.life+=dt; any=true; d.v.multiplyScalar(1-dt*1.1); d.v.y-=0.35*dt;
      pos[i*3]+=d.v.x*dt; pos[i*3+1]+=d.v.y*dt; pos[i*3+2]+=d.v.z*dt;
      const t=d.life/d.max; alpha[i]=Math.min(1,t*8)*(1-t)*(0.6+0.4*Math.sin(time*14+d.tw));}
    if(any){dust.points.geometry.attributes.position.needsUpdate=true; dust.points.geometry.attributes.aAlpha.needsUpdate=true;} }

  // 소행성
  asteroidRing.rotation.y+=dt*0.06*P.asteroidSpeed;
  for(const a of asteroids){a.m.rotation.x+=a.spin.x*dt;a.m.rotation.y+=a.spin.y*dt;a.m.rotation.z+=a.spin.z*dt;}

  // 배경
  if(meteor.life>=0){ meteor.life+=dt; meteor.m.position.addScaledVector(meteor.v,dt);
    const t=meteor.life/1.5; meteorMat.uniforms.uA.value=Math.sin(Math.min(t,1)*Math.PI);
    if(t>=1){meteor.life=-1;meteor.m.visible=false;} }
  if(time>meteor.next){ launchMeteor(); meteor.next=time+nextMeteorGap(); }

  updateSolar(dt);
  if(camAnim.on){ camAnim.t+=dt/camAnim.dur; const k=Math.min(camAnim.t,1), e=k*k*(3-2*k);
    camera.position.lerpVectors(camAnim.fp,camAnim.tp,e); controls.target.lerpVectors(camAnim.ft,camAnim.tt,e);
    if(k>=1) camAnim.on=false; }
  camera.position.sub(travel.shakeOff);
  controls.update();
  if(travel.shake>0){ travel.shake-=dt; const a=Math.max(0,travel.shake)*0.12*(solar.bodies[travel.target]?.r||1)*0.3; travel.shakeOff.set(rr(-a,a),rr(-a,a),rr(-a,a)); } else travel.shakeOff.set(0,0,0);
  camera.position.add(travel.shakeOff);

  // 블록에 초점
  if(tiltH.enabled){ if(solar.observe>=0&&P.showSolar) focusV.copy(solar.bodies[solar.observe].mesh.position).project(camera); else focusV.set(0,-1.8,0).applyMatrix4(diorama.matrixWorld).project(camera);
    const fy=THREE.MathUtils.clamp(focusV.y*0.5+0.5,0.1,0.9);
    for(const p of [tiltH,tiltV]){p.uniforms.uFocus.value=fy; p.uniforms.uAmount.value=P.blur;} }
  finalPass.uniforms.uTime.value=time;

  composer.render(dt);

  if(P.showFps){ fpsAcc+=dt; fpsN++; if(fpsAcc>0.5){fpsEl.textContent=`${Math.round(fpsN/fpsAcc)} fps · ${P.quality}`; fpsAcc=0; fpsN=0;} }
}

  renderer.setSize(innerWidth,innerHeight); updateView(); composer.setSize(innerWidth,innerHeight); updateTiltRes();
});

applyQuality(P.quality);
renderer.setAnimationLoop(tick);
window.__dioramaStarted=true;
